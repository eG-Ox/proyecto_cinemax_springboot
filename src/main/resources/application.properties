spring.config.import=optional:file:.env[.properties]
spring.application.name=cinemax
server.port=${SERVER_PORT:8000}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cine}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/docs
cinemax.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
cinemax.security.admin.username=${CINEMAX_ADMIN_USUARIO:admin}
cinemax.security.admin.password=${CINEMAX_ADMIN_PASSWORD:}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=8KB
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never
