# Base local persistente para ejecutar sin PostgreSQL. No carga datos inventados.
spring.datasource.url=jdbc:h2:file:${CINEMAX_DATA_DIR:${user.home}/.cinemax}/cinemax;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
